name: Actualisation de l'Emploi du Temps

on:
  schedule:
    - cron: '0 4 * * *'  # Une fois par jour à 4h UTC (5h en hiver, 6h en été) ; GitHub peut décaler l'exécution
  workflow_dispatch:         # Lancement manuel

permissions:
  contents: write

# Jamais deux actualisations en même temps (ADE limite le nombre de requêtes)
concurrency:
  group: actualisation-edt
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false   # conserve le dossier cache/ (derniers flux ADE valides) d'une exécution à l'autre

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests icalendar tzdata

      - name: Générer les données
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python generer_edt.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 2. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Vérification que data.js a bien été produit par le script
          if (-not (Test-Path site\data.js)) {
              Write-Error "Le fichier site/data.js n'a pas été généré par generer_edt.py !"
              exit 1
          }

          # 4. Nettoyage préventif
          if (git branch --list gh-pages-temp) { git branch -D gh-pages-temp }

          # 5. Branche orpheline ne contenant que la page et ses données (à la racine)
          git checkout --orphan gh-pages-temp
          git rm -r -q --cached .
          Copy-Item site\index.html, site\data.js -Destination . -Force
          git add -f index.html data.js

          # 6. Commit et push forcé
          git commit -q -m "Mise à jour automatique de l'emploi du temps"
          git push origin gh-pages-temp:gh-pages --force

          # 7. Nettoyage final
          git checkout main -f
          git branch -D gh-pages-temp
