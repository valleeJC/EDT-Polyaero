name: Actualisation de l'Emploi du Temps

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 6h UTC (8h heure française)
  workflow_dispatch:      # Lancement manuel

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer les dépendances
        shell: powershell
        run: |
          # Utilisation directe du python de la machine
          python -m pip install --upgrade pip
          pip install requests icalendar urllib3 tzdata

      - name: Exécuter le script
        env:
          PYTHONIOENCODING: "utf-8"
        shell: powershell
        run: |
          python EDT_actualisation.py

      - name: Déployer sur gh-pages (PowerShell)
        shell: powershell
        run: |
          # 1. Ajout du chemin Git au PATH
          $env:Path += ";C:\Program Files\Git\cmd;C:\Program Files\Git\bin"

          # 2. Configuration de l'identité Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Nettoyage préventif
          git checkout main -f
          if (git branch --list gh-pages-temp) { git branch -D gh-pages-temp }

          # 4. Vérification que index.html a bien été produit par le script
          if (-not (Test-Path index.html)) {
              Write-Error "Le fichier index.html n'a pas été généré par EDT_actualisation.py !"
              exit 1
          }

          # 5. Création de la branche orpheline
          git checkout --orphan gh-pages-temp

          # 6. Ajout du fichier HTML généré
          git add -f index.html

          # 7. Commit et Push forcé
          git commit -m "🤖 Mise à jour automatique de l'emploi du temps"
          git push origin gh-pages-temp:gh-pages --force

          # 8. Nettoyage final propre
          git checkout main -f
          git branch -D gh-pages-temp
